name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 file gcc-aarch64-linux-gnu qemu-user
      - uses: actions/checkout@v4
        with:
          repository: enderman-claude/shard
          path: shard
      - name: build shard tools
        run: make -C shard build/elfpack build/shardelf
      - name: install llvm-mingw (Windows ARM64 cross compiler, pinned and checked)
        run: |
          curl -sSL -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf llvm-mingw.tar.xz -C "$HOME"
          echo "$HOME/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: run tests
        env:
          EMBER_ELFPACK: ${{ github.workspace }}/shard/build/elfpack
          EMBER_SHARDELF: ${{ github.workspace }}/shard/build/shardelf
        run: python -m unittest discover -s tests -v
