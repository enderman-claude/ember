name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 file gcc-aarch64-linux-gnu qemu-user
      - name: run tests
        run: python -m unittest discover -s tests -v
